[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.32.55"
edition = "2024"
rust-version = "1.97"
license = "GPL-2.0-only"
repository = "https://github.com/WerrySs/PentaX"

[workspace.dependencies]
pentax-loader = { path = "crates/pentax-loader" }
pentax-config = { path = "crates/pentax-config" }
pentax-core = { path = "crates/pentax-core" }
pentax-session = { path = "crates/pentax-session" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

