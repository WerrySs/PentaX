# Prefer MIT where a dependency offers alternatives. AND requirements, including
# the bundled fonts and Unicode data, retain every required license.
accepted = [
    "MIT",
    "Apache-2.0",
    # winx's exact SPDX expression. Retain its complete Apache text and LLVM
    # exception, including the explicit GPLv2 combination clause:
    # https://spdx.org/licenses/LLVM-exception.html
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
    "Unlicense",
    "GPL-2.0-or-later",
    "GPL-2.0-only",
]

# Cover the complete shipped platform set, including target-specific crates.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

# The published manifest omits the embedded Hack font's Bitstream Vera notice.
# Preserve its existing alternatives/AND requirements and the additional terms
# established by the complete, checksum-verified font notices in the crate.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

