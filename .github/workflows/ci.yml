name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure isolated Cargo paths
        shell: bash
        env:
          CI_CARGO_HOME: ${{ runner.temp }}/pentax-cargo
          CI_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          printf 'CARGO_HOME=%s\n' "$CI_CARGO_HOME" >> "$GITHUB_ENV"
          printf 'RUSTFLAGS=--remap-path-prefix=%s=/source --remap-path-prefix=%s=/cargo\n' "$CI_SOURCE_ROOT" "$CI_CARGO_HOME" >> "$GITHUB_ENV"
      - name: Cache hosted-runner Cargo dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/pentax-cargo/registry
            ${{ runner.temp }}/pentax-cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Use the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check portable library targets with Clippy
        run: >-
          cargo clippy --locked -p pentax-loader -p pentax-linker -p pentax-codegen -p pentax-shader -p pentax-shader-compiler -p pentax-gpu -p pentax-config -p pentax-kernel -p pentax-session --all-targets -- -D warnings
      - name: Test portable library contracts
        run: cargo test --locked -p pentax-loader -p pentax-linker -p pentax-codegen -p pentax-shader -p pentax-shader-compiler -p pentax-gpu -p pentax-config -p pentax-kernel -p pentax-session --lib -- --test-threads=2

  windows:
    name: Windows build and CPU contracts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure isolated Cargo paths
        shell: bash
        env:
          CI_CARGO_HOME: ${{ runner.temp }}/pentax-cargo
          CI_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          printf 'CARGO_HOME=%s\n' "$CI_CARGO_HOME" >> "$GITHUB_ENV"
          printf 'RUSTFLAGS=--remap-path-prefix=%s=/source --remap-path-prefix=%s=/cargo\n' "$CI_SOURCE_ROOT" "$CI_CARGO_HOME" >> "$GITHUB_ENV"
      - name: Cache hosted-runner Cargo dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/pentax-cargo/registry
            ${{ runner.temp }}/pentax-cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: cargo-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Use the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check the complete Windows workspace with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the desktop, CLI and worker
        run: cargo build --locked --release -p pentax-desktop -p pentax-cli -p pentax-worker
      - name: Test core provider and startup contracts
        # These two original integration fixtures require a usable Vulkan device.
        # They are exercised locally under the shared GPU resource gate.
        run: >-
          cargo test --locked -p pentax-core --lib -- --test-threads=1
          --skip gpu::shaders::tests::registered_shader_extent_is_consumed_by_actual_compute_preparation_and_gpu_writeback
          --skip process::hle::kernel_startup::graphics_runtime::interrupt_tests::fenced_compute_then_label_and_interrupt_deliver_actual_ordered_coalesced_state
      - name: Test timestamp admission and state
        run: >-
          cargo test --locked -p pentax-platform --lib tests::timestamp_counter_tests:: -- --test-threads=1
      - name: Test live stack permissions
        run: cargo test --locked -p pentax-platform --lib combined_stack_preflight_checks_live_full_spans_cpu_rights_holes_and_poison -- --test-threads=1
      - name: Test software CPU identification and atomic refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::cpu_identification_tests:: -- --test-threads=1
      - name: Test bounded snapshot candidate diagnostics
        run: cargo test --locked -p pentax-worker --bin pentax-worker static_candidates_are_aggregate_private_value_independent_and_stop_at_bounds -- --test-threads=1
      - name: Test native YMM admission and context preservation
        run: >-
          cargo test --locked -p pentax-platform --lib ymm_bridge::tests:: -- --test-threads=1
      - name: Test native YMM and immutable admission publication boundaries
        run: >-
          cargo test --locked -p pentax-platform --lib -- tests::native_ymm_tests:: tests::native_cache:: libc_builtin_tests:: --test-threads=1
      - name: Test explicit supplied-libc memory builtins with original callers
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe libc_memory_builtins:: -- --test-threads=1
      - name: Test explicit private sample output with original code
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe private_samples_opt_in_exports_completed_relative_rows_and_preserves_guest_outcomes -- --test-threads=1
      - name: Test native string-index state and dependent continuations
        run: >-
          cargo test --locked -p pentax-platform --lib -- native_string_index_tests:: packed_comparison_all_controls_and_lengths_match_hardware --test-threads=1 --nocapture
      - name: Test indexed graphics host admission
        run: >-
          cargo test --locked -p pentax-platform --lib -- vulkan::graphics::tests:: vulkan::device::tests:: --test-threads=1
      - name: Test scalar FMA admission and software rounding
        run: >-
          cargo test --locked -p pentax-platform --lib -- native_scalar_fma_tests:: fused_float::tests:: --test-threads=1
      - name: Test original scalar FMA worker consumers
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_scalar_fma:: -- --test-threads=1
      - name: Test bounded wait and publication observations
        run: >-
          cargo test --locked -p pentax-kernel --lib pthread_mutex::observations::tests:: -- --test-threads=1
      - name: Test native publication history boundaries
        run: >-
          cargo test --locked -p pentax-platform --lib cache_causality_tests:: -- --test-threads=1
      - name: Test original cache and wait observation callers
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe -- kernel_results::cache_causality:: kernel_results::pthread_condition:: --test-threads=1
      - name: Test paired native retention and late entry boundaries
        run: >-
          cargo test --locked -p pentax-platform --lib -- two_way_cache_tests:: cache_causality_tests:: tests::native_cache:: --test-threads=1
      - name: Test paired decoded-plan retention and epoch observations
        run: >-
          cargo test --locked -p pentax-worker --bin pentax-worker -- native_session::plan_cache:: native_session::causality:: --test-threads=1
      - name: Test bounded interactive CLI records
        run: >-
          cargo test --locked -p pentax-cli --bin pentax-cli entry::tests:: -- --test-threads=1
      - name: Test owned interactive process lifetime and cancellation
        run: >-
          cargo test --locked -p pentax-platform --lib supervised_process:: -- --test-threads=1
      - name: Test interactive frame deadlines and retained resource policies
        run: >-
          cargo test --locked -p pentax-worker --bin pentax-worker -- native_session::frame_bridge::tests:: image_probe::interactive::tests:: --test-threads=1
      - name: Test desktop interactive launch plans
        run: >-
          cargo test --locked -p pentax-desktop --bin pentax launch::tests:: -- --test-threads=1
      - name: Test original finite programs through interactive worker and CLI
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
          PENTAX_TEST_CLI: ${{ github.workspace }}/target/release/pentax-cli.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::interactive:: -- --test-threads=1
      - name: Test explicit private console output with original code
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::private_console:: -- --test-threads=1
      - name: Test bounded private console serialization
        run: >-
          cargo test --locked -p pentax-worker --bin pentax-worker image_probe::private_console::tests:: -- --test-threads=1
      - name: Test signed packed-qword comparison state and refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::qword_comparisons:: -- --test-threads=1
      - name: Test saturating packed-integer state and refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::saturating_packs_tests:: -- --test-threads=1
      - name: Test signed packed-word multiply-add state and refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::multiply_add_words_tests:: -- --test-threads=1
      - name: Test the native CPU and kernel counter boundary
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::timestamp_counter:: -- --test-threads=1
      - name: Test bounded final-only startup samples
        run: >-
          cargo test --locked -p pentax-worker --bin pentax-worker -- native_session::startup_profile::block_samples::tests:: native_session::startup_profile::block_samples::private_samples::tests:: --test-threads=1
      - name: Test admitted packed floating-point results and refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_packed_float_tests:: -- --test-threads=1
      - name: Test checked packed floating-point memory reads and refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_packed_float_memory_tests:: -- --test-threads=1
      - name: Test admitted vector register copy and bit operations
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_vector_register_bits_tests:: -- --test-threads=1
      - name: Test immutable branch metadata with live target checks
        run: >-
          cargo test --locked -p pentax-platform --lib tests::target_source_memo_tests:: -- --test-threads=1
      - name: Test aligned native streaming stores and pre-entry refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_streaming_stores_tests:: -- --test-threads=1
      - name: Test exact native vector memory copies and pre-entry refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_vector_memory_tests:: -- --test-threads=1
      - name: Test exact native scalar arithmetic and pre-entry refusals
        run: >-
          cargo test --locked -p pentax-platform --lib tests::native_scalar_float_tests:: -- --test-threads=1
      - name: Test original native packed floating-point continuations
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_packed_float:: -- --test-threads=1
      - name: Test original native packed floating-point memory continuations
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_packed_float_memory:: -- --test-threads=1
      - name: Test original native vector register bits
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_vector_register_bits:: -- --test-threads=1
      - name: Test streaming-store publication before mediated reads
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_streaming_stores:: -- --test-threads=1
      - name: Test original vector memory copies across real native boundaries
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_vector_memory:: -- --test-threads=1
      - name: Test original scalar arithmetic across real native boundaries
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::native_scalar_float:: -- --test-threads=1
      - name: Test existing non-temporal store consumers
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_non_temporal_vector_stores_write_exact_width_and_preserve_the_source -- --test-threads=1
      - name: Test existing vector instructions after memory copy promotion
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::vector_instructions:: -- --test-threads=1
      - name: Test affected original vector consumers and CPU memory mapping
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe --
          kernel_results::precision_vectors:: kernel_results::minmax_vectors::
          kernel_results::align_right:: kernel_results::element_permutations::
          kernel_results::immediate_permutations:: kernel_results::lane_extract::
          kernel_results::minimum_position:: kernel_results::packed_convert::
          kernel_results::rounding::
          native_cpu_write_mapping_supports_x86_vector_reads_without_changing_reported_protection
          --test-threads=1
      - name: Test retained main-thread wait observations on a typed stop
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_mutex_finite_deadlines_preserve_owner_and_indefinite_cycle_stops -- --test-threads=1
      - name: Test native software CPU identification
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::cpu_identification:: -- --test-threads=1
      - name: Test native signed packed-qword comparisons
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::qword_comparisons:: -- --test-threads=1
      - name: Test native saturating packed-integer forms
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::saturating_packs:: -- --test-threads=1
      - name: Test native signed packed-word multiply-add
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe kernel_results::multiply_add_words:: -- --test-threads=1
      - name: Test actual native YMM register boundaries and counts
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_ymm_bridge_proves_all_registers_boundaries_upper_rules_and_real_native_counts -- --test-threads=1
      - name: Test native ACM context creation and exact scopes
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_acm_context_creation_binds_exact_scopes_and_writes_sequential_u32_handles -- --test-threads=1
      - name: Test native event-flag parking and complete thread context restoration
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_event_flag_wait_parks_both_threads_and_restores_all_ymm_with_real_clear_modes -- --test-threads=1
      - name: Test native stateless AudioOut2 sizes, aliases and paired scopes
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_audio_out2_stateless_profiles_preserve_exact_sizes_aliases_and_paired_scopes -- --test-threads=1
      - name: Test native AudioOut2 PCM ownership and cooperative queues
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_audio_out2_headless_pcm_lease_and_full_queue_preserve_real_thread_continuations -- --test-threads=1
      - name: Test POSIX self on actual selected guest threads
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_posix_self_uses_each_actual_selected_thread_and_keeps_tls_distinct -- --test-threads=1
      - name: Test native cooperative microsecond sleep and exact POSIX binding
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_canonical_and_posix_usleep_park_while_another_guest_runs_and_preserve_context -- --test-threads=1
      - name: Test native bit-string elements and live index dependencies
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe native_bit_strings_use_signed_indices_masked_immediates_and_live_dependency_splits -- --test-threads=1
      - name: Test native JSON ownership, parsing and exact import scopes
        env:
          PENTAX_TEST_WORKER: ${{ github.workspace }}/target/release/pentax-worker.exe
        run: >-
          cargo test --locked -p pentax-worker --test image_probe json_ -- --test-threads=1
